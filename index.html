<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anxro Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root{
          --bg: #020a07;
          --surface: #0a1f17;
          --emerald: #10b981;
          --emerald-light: #34d399;
          --emerald-dim: rgba(16,185,129,0.15);
          --white: #f8fafc;
          --white-muted: #94a3b8;
          --border: rgba(255,255,255,0.08);
          --input-bg: #041a12;
          --ff-display: 'Sora', sans-serif;
          --ff-body: 'Outfit', sans-serif;
        }
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        body{
          font-family:var(--ff-body);
          background:var(--bg);
          color:var(--white);
          height:100vh;
          display:flex;
          flex-direction:column;
          background-image:radial-gradient(ellipse 100% 60% at 50% -20%,rgba(16,185,129,0.12) 0%,transparent 70%);
        }
       .header{
          padding:16px 20px;
          background:var(--surface);
          border-bottom:1px solid var(--border);
          display:flex;
          align-items:center;
          gap:12px;
        }
       .header .status{
          width:10px;height:10px;border-radius:50%;background:#ef4444;
        }
       .header .status.online{background:var(--emerald);}
       .header h2{font-family:var(--ff-display);font-size:1.1rem;font-weight:700;}
       .header .code{margin-left:auto;font-size:0.8rem;color:var(--white-muted);}
       .connect-box{
          padding:16px;
          background:var(--surface);
          border-bottom:1px solid var(--border);
          display:flex;
          gap:8px;
        }
       .connect-box input{
          flex:1;
          padding:12px 16px;
          border-radius:12px;
          border:1px solid var(--border);
          background:var(--input-bg);
          color:var(--white);
          outline:none;
          font-size:16px;
        }
       .connect-box input:focus{border-color:var(--emerald);}
       .connect-box button{
          padding:12px 20px;
          border-radius:12px;
          border:none;
          background:linear-gradient(135deg,var(--emerald),var(--emerald-light));
          color:var(--bg);
          font-weight:700;
          cursor:pointer;
        }
       .chatbox{
          flex:1;
          overflow-y:auto;
          padding:20px;
          display:flex;
          flex-direction:column;
          gap:12px;
        }
       .msg{
          max-width:75%;
          padding:12px 16px;
          border-radius:18px;
          word-wrap:break-word;
          animation:msgIn 0.2s ease;
        }
        @keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
       .msg.me{
          align-self:flex-end;
          background:linear-gradient(135deg,var(--emerald),var(--emerald-light));
          color:var(--bg);
          border-bottom-right-radius:4px;
        }
       .msg.them{
          align-self:flex-start;
          background:var(--surface);
          border:1px solid var(--border);
          border-bottom-left-radius:4px;
        }
       .msg .pending{font-size:0.7rem;opacity:0.7;margin-left:4px;}
       .input-area{
          padding:16px;
          background:var(--surface);
          border-top:1px solid var(--border);
          display:flex;
          gap:8px;
        }
       .input-area input{
          flex:1;
          padding:14px 18px;
          border-radius:16px;
          border:1px solid var(--border);
          background:var(--input-bg);
          color:var(--white);
          outline:none;
          font-size:16px;
        }
       .input-area input:focus{border-color:var(--emerald);}
       .input-area button{
          width:50px;
          height:50px;
          border-radius:50%;
          border:none;
          background:linear-gradient(135deg,var(--emerald),var(--emerald-light));
          color:var(--bg);
          font-size:1.2rem;
          cursor:pointer;
          display:flex;
          align-items:center;
          justify-content:center;
        }
       .input-area button:active{transform:scale(0.9);}
       .toast{
          position:fixed;
          bottom:90px;
          left:50%;
          transform:translateX(-50%);
          background:var(--surface);
          padding:12px 20px;
          border-radius:12px;
          border:1px solid var(--border);
          font-size:0.85rem;
          opacity:0;
          pointer-events:none;
          transition:opacity 0.3s;
        }
       .toast.show{opacity:1;}
    </style>
</head>
<body>
    <div class="header">
        <div class="status" id="statusDot"></div>
        <h2 id="friendName">Not Connected</h2>
        <div class="code">Your ID: <span id="myCode">-----</span></div>
    </div>

    <div class="connect-box" id="connectBox">
        <input type="number" id="friendCode" placeholder="Enter friend's 5-digit code" inputmode="numeric">
        <button onclick="connectToFriend()">Connect</button>
    </div>

    <div class="chatbox" id="chatbox"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()"><i class="fa fa-paper-plane"></i></button>
    </div>

    <div class="toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    // 1. Get user ID from your auth system
    const user = JSON.parse(localStorage.getItem('userProfile'));
    if(!user || !user.userId){
        alert('Please login first');
        window.location.href = 'index.html';
    }
    const myCode = user.userId;
    document.getElementById('myCode').innerText = myCode;

    // 2. Setup IndexedDB for offline queue
    let db;
    const dbReq = indexedDB.open('AnxroChatQueue', 1);
    dbReq.onupgradeneeded = e => e.target.result.createObjectStore('messages', {keyPath: 'id', autoIncrement: true});
    dbReq.onsuccess = e => {
        db = e.target.result;
        retryQueuedMessages();
    };

    // 3. Setup PeerJS
    const peer = new Peer(myCode, {
        debug: 2,
        config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]}
    });
    let conn = null;
    let friendCode = null;

    peer.on('open', id => {
        showToast('Ready. Your ID: ' + id);
    });

    peer.on('error', err => {
        showToast('Error: ' + err.type);
    });

    // 4. Handle incoming connections
    peer.on('connection', c => {
        if(conn && conn.open) c.close(); // Only 1 connection
        conn = c;
        friendCode = c.peer;
        setupConnection();
    });

    function setupConnection(){
        document.getElementById('friendName').innerText = 'User ' + friendCode;
        document.getElementById('statusDot').classList.add('online');
        document.getElementById('connectBox').style.display = 'none';
        showToast('Connected to ' + friendCode);
        
        conn.on('data', data => {
            addMessage(data.text, 'them', data.time);
        });
        
        conn.on('close', () => {
            document.getElementById('statusDot').classList.remove('online');
            showToast('Disconnected');
            conn = null;
        });

        retryQueuedMessages(); // Send backlog
    }

    // 5. Connect to friend
    function connectToFriend(){
        const code = document.getElementById('friendCode').value;
        if(code.length !== 5) return showToast('Enter 5-digit code');
        if(code === myCode) return showToast("Can't connect to yourself");
        
        friendCode = code;
        conn = peer.connect(code, {reliable: true});
        conn.on('open', setupConnection);
        conn.on('error', () => showToast('Failed to connect'));
    }

    // 6. Send message
    function sendMessage(){
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(!text || !friendCode) return;
        
        const msg = {to: friendCode, text: text, from: myCode, time: Date.now()};
        
        if(conn && conn.open){
            conn.send(msg);
            addMessage(text, 'me', msg.time);
        } else {
            saveToQueue(msg);
            addMessage(text, 'me', msg.time, true);
            showToast('User offline. Message queued');
        }
        input.value = '';
    }

    // 7. IndexedDB Queue functions
    function saveToQueue(msg){
        const tx = db.transaction('messages', 'readwrite');
        tx.objectStore('messages').add(msg);
    }

    function retryQueuedMessages(){
        if(!conn || !conn.open || !db || !friendCode) return;
        
        const tx = db.transaction('messages', 'readwrite');
        const store = tx.objectStore('messages');
        store.getAll().onsuccess = e => {
            e.target.result.forEach(msg => {
                if(msg.to === friendCode){
                    conn.send(msg);
                    store.delete(msg.id);
                    updateMessageStatus(msg.time);
                }
            });
        };
    }

    // 8. UI functions
    function addMessage(text, who, time, pending=false){
        const div = document.createElement('div');
        div.className = 'msg ' + who;
        div.dataset.time = time;
        div.innerHTML = text + (pending ? '<span class="pending">⏳</span>' : '');
        document.getElementById('chatbox').append(div);
        div.scrollIntoView({behavior: 'smooth'});
    }

    function updateMessageStatus(time){
        const msg = document.querySelector(`[data-time="${time}"]`);
        if(msg) msg.querySelector('.pending')?.remove();
    }

    function showToast(text){
        const t = document.getElementById('toast');
        t.innerText = text;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // 9. Retry every 30s while app open
    setInterval(() => {
        if(document.visibilityState === 'visible') retryQueuedMessages();
    }, 30000);

    // 10. Reconnect on tab focus
    document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible' && friendCode && (!conn || !conn.open)){
            connectToFriend(friendCode);
        }
    });
</script>
</body>
</html>
